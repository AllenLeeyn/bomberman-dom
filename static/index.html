<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>DOMbers</title>
  <link rel="icon" href="./static/app/assets/favicon.png" type="image/png" sizes="32x32">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="./static/app/style.css" />
  <link rel="stylesheet" href="./static/app/game.css" />
  <link rel="stylesheet" href="./static/app/mobile.css" />
</head>
<body>
  <div id="fullscreen-button" style="display: none;">⛶ Fullscreen</div>
  <div id="game-wrapper">

    <!-- Player HUD - positioned above game area -->
    <div id="player-hud"></div>
    
    <div id="game-root">
      <div id="pool-layer">
      </div>

      <div id="tile-layer">
      </div>

      <div id="spike-layer">
      </div>

      <div id="bomb-layer">
      </div>

      <div id="block-layer">
      </div>

      <div id="explosion-layer">
      </div>

      <div id="player-layer">
      </div>
    </div> 

    <div id="mobile-warning" style="display: none;" class="mobile-warning">
      For best experience, rotate your device to landscape and enter fullscreen mode.
    </div>

    <div id="mobile-controls" style="display: none;">
      <div id="joystick-container">
        <div id="joystick"></div>
      </div>
      <div id="bomb-button">💣</div>
    </div>


    <div id="app">
    </div>
    <script type="module" src="./static/app/app.js"></script>

  </div>
</body>
</html>
